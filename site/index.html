<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f9fb"><title>CloneGRAM · Yayın stüdyosu</title>
<style>
:root{color-scheme:light;--bg:oklch(98% .008 236);--surface:oklch(100% .004 236);--ink:oklch(23% .025 250);--muted:oklch(55% .025 250);--line:oklch(91% .018 236);--blue:oklch(65% .16 236);--blue-dark:oklch(50% .15 236);--blue-pale:oklch(94% .045 236);--green:oklch(60% .13 154);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.side{background:var(--surface);border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;font-size:20px;letter-spacing:-.06em}.brand img{width:36px;height:36px}.brand span{color:var(--blue-dark)}.ws{padding:12px;border:1px solid var(--line);border-radius:10px;margin:0 6px;font-size:12px;color:var(--muted)}.ws strong{display:block;color:var(--ink);font-size:14px;margin-top:4px}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);padding:0 10px;margin:0 0 8px}.nav{display:grid;gap:5px}.nav button{min-height:44px;border:0;background:transparent;border-radius:8px;padding:10px;color:var(--muted);text-align:left;font-size:14px}.nav button:hover{background:var(--bg);color:var(--ink)}.nav button.active{background:var(--blue-pale);color:var(--blue-dark);font-weight:650}.health{margin-top:auto;background:var(--blue-pale);border-radius:10px;padding:13px;font-size:13px}.health b{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.health p{margin:5px 0 0;color:var(--muted);font-size:12px}.main{min-width:0}.top{height:68px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,54px);font-size:14px;color:var(--muted)}.top strong{color:var(--ink)}.profile{display:flex;align-items:center;gap:12px}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:white;font-size:12px}.page{max-width:1220px;padding:38px clamp(20px,4vw,54px) 52px;margin:auto}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--muted)}h1{font-size:clamp(30px,3vw,40px);letter-spacing:-.055em;line-height:1.08;margin:8px 0;font-weight:690}h2{font-size:17px;letter-spacing:-.025em;margin:0;font-weight:660}.desc{color:var(--muted);margin:0;max-width:65ch}.btn{min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 15px;font-size:14px;font-weight:620;color:var(--ink)}.btn:hover{background:var(--bg)}.btn.primary{background:var(--blue-dark);border-color:var(--blue-dark);color:white}.btn.primary:hover{background:oklch(45% .15 236)}.notice{display:flex;gap:10px;align-items:center;background:var(--blue-pale);border:1px solid oklch(89% .05 236);border-radius:9px;padding:11px 14px;color:var(--blue-dark);font-size:13px;margin-bottom:29px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.8fr);gap:42px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.link{color:var(--blue-dark);border:0;background:none;font-size:13px;font-weight:650}.feed,.sources{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.thumb{height:52px;border-radius:8px;display:grid;place-items:center;color:var(--blue-dark);background:linear-gradient(140deg,#cbe8f6,#8ecbe8 60%,#e1f2f9);font-weight:700}.thumb.photo{background:linear-gradient(140deg,#d5e6d8,#a7c9ac 60%,#e8f0db);color:#477b56}.thumb.note{background:#f1e8dd;color:#a16a36}.title{font-size:14px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:4px}.pill{font-size:11px;padding:4px 8px;border-radius:99px;background:var(--blue-pale);color:var(--blue-dark);font-weight:650;white-space:nowrap}.pill.warn{background:oklch(96% .035 80);color:#93631c}.source{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.ok{font-size:12px;color:var(--green);font-weight:650}.small{font-size:12px;color:var(--muted)}.workflow{margin-top:36px}.steps{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-top:14px}.step{display:flex;gap:12px;padding:19px 16px 19px 0}.step+.step{border-left:1px solid var(--line);padding-left:16px}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--blue-pale);color:var(--blue-dark);font-size:12px;font-weight:700;flex:none}.step b{font-size:13px}.step p{font-size:12px;color:var(--muted);margin:4px 0 0;max-width:25ch}.foot{border-top:1px solid var(--line);padding-top:14px;margin-top:32px;color:var(--muted);font-size:12px}.list{border-top:1px solid var(--line)}.listrow{display:grid;grid-template-columns:minmax(220px,2fr) 1fr 1fr auto;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:15px 8px;font-size:13px}.listrow.header{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--surface);color:var(--ink)}.field textarea{min-height:100px}.settings{display:flex;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}.settings b{font-size:14px}.settings p{margin:5px 0;color:var(--muted);font-size:13px}.switch{width:44px;height:26px;border:0;border-radius:99px;background:var(--line);padding:3px}.switch span{display:block;width:20px;height:20px;background:white;border-radius:50%;transition:transform .18s}.switch[aria-checked=true]{background:var(--blue-dark)}.switch[aria-checked=true] span{transform:translateX(18px)}.toast{position:fixed;right:20px;bottom:20px;max-width:360px;background:var(--ink);color:white;padding:13px 16px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:none}.mobile{display:none}
@media(max-width:850px){.app{grid-template-columns:196px 1fr}.grid{grid-template-columns:1fr;gap:30px}.steps{grid-template-columns:1fr}.step,.step+.step{border-left:0;border-bottom:1px solid var(--line);padding:14px 0}.step:last-child{border-bottom:0}}
@media(max-width:600px){.app{display:block;padding-bottom:66px}.side{display:none}.top{height:58px;padding:0 18px}.page{padding:28px 18px}.hero{align-items:flex-start;flex-direction:column}.hero .btn{width:100%}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--surface);border-top:1px solid var(--line);grid-template-columns:repeat(4,1fr);z-index:3}.mobile button{border:0;background:none;color:var(--muted);font-size:11px}.mobile button.active{color:var(--blue-dark);font-weight:650}.listrow{grid-template-columns:minmax(130px,1.5fr) .8fr auto;gap:8px}.listrow>*:nth-child(3){display:none}.listrow.header>*:nth-child(3){display:none}.notice{align-items:flex-start}.profile .badge{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><img src="/assets/clonegram-mark.svg" alt=""><div>Clone<span>GRAM</span></div></div><div class="ws">ÇALIŞMA ALANI<strong>CloneGRAM Studio</strong></div><nav class="nav" aria-label="Ana menü"><p class="nav-label">Yayın stüdyosu</p><button class="active" data-page="overview">▦ &nbsp; Genel görünüm</button><button data-page="queue">☷ &nbsp; İçerik kuyruğu <span class="small">3</span></button><button data-page="campaigns">✉ &nbsp; Kampanyalar</button><button data-page="connections">⤳ &nbsp; Bağlantılar</button><p class="nav-label" style="margin-top:18px">Yönetim</p><button data-page="settings">⚙ &nbsp; Ayarlar</button></nav><div class="health"><b><i class="dot"></i> Önizleme hazır</b><p>Bu prototip henüz Telegram’a bağlanmıyor.</p></div></aside><main class="main"><header class="top"><span>Çalışma alanı / <strong id="crumb">Genel görünüm</strong></span><div class="profile"><span class="badge">Önizleme modu</span><span class="avatar">EE</span></div></header><div class="page" id="page"></div></main></div><nav class="mobile" aria-label="Mobil menü"><button class="active" data-page="overview">Özet</button><button data-page="queue">Kuyruk</button><button data-page="campaigns">Kampanya</button><button data-page="connections">Kaynaklar</button></nav><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const pageEl=document.querySelector('#page');let current='overview',timer;const items=[['VID','video','Haftalık ilham: tasarımın küçük detayları','@studio_notes · 2 dk önce','İncele','warn'],['IMG','photo','Yeni koleksiyondan bir kare','Creative Lab · 8 dk önce','Hazır',''],['TXT','note','Bugünün kısa notu','@studio_notes · 14 dk önce','Hazır','']];const rows=()=>`<div class="feed">${items.map(i=>`<div class="row"><div class="thumb ${i[1]}">${i[0]}</div><div><div class="title">${i[2]}</div><div class="meta">${i[3]}</div></div><span class="pill ${i[5]}">${i[4]}</span></div>`).join('')}</div>`;const src=()=>`<div class="sources"><div class="source"><div><div class="title">@studio_notes</div><div class="small">Kanal · 2 dk önce eşitlendi</div></div><span class="ok">Bağlı</span></div><div class="source"><div><div class="title">Creative Lab</div><div class="small">Grup · 8 dk önce eşitlendi</div></div><span class="ok">Bağlı</span></div></div>`;
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));const names={overview:'Genel görünüm',queue:'İçerik kuyruğu',campaigns:'Kampanyalar',connections:'Bağlantılar',settings:'Ayarlar'};document.querySelector('#crumb').textContent=names[current];if(current==='overview')pageEl.innerHTML=`<div class="hero"><div><span class="eyebrow">CUMARTESİ · 26 EYLÜL 2026</span><h1>Yayın akışın, kontrol altında.</h1><p class="desc">İçeriği gözden geçir, düzenle ve hedef kanalına hazırla. Son adım her zaman sende.</p></div><button class="btn primary" data-action="source">＋ Kaynak ekle</button></div><div class="notice">ⓘ &nbsp;Önizleme modu: örnek veriler gösteriliyor. Telegram bağlantısı ve yayın henüz etkin değil.</div><div class="grid"><section><div class="head"><h2>İnceleme bekleyenler</h2><button class="link" data-page="queue">Tüm kuyruğu gör →</button></div>${rows()}<div class="workflow"><h2>Akış nasıl ilerliyor?</h2><div class="steps"><div class="step"><span class="num">1</span><div><b>Kaynaklardan al</b><p>Yalnızca yetkili olduğun, korumasız içerik.</p></div></div><div class="step"><span class="num">2</span><div><b>Düzenle ve onayla</b><p>Filigran, açıklama ve önizleme burada.</p></div></div><div class="step"><span class="num">3</span><div><b>Hedefe yayımla</b><p>İzinli kanala, planlı ya da hemen.</p></div></div></div></div></section><aside><div class="head"><h2>Bağlantıların</h2><button class="link" data-page="connections">Yönet</button></div>${src()}<div class="workflow"><h2>Bugün</h2><div class="source"><div><div class="title">İnceleme kuyruğu</div><div class="small">Yayın öncesi onay gerekli</div></div><span class="pill warn">3 içerik</span></div><div class="source"><div><div class="title">Otomatik yayımlama</div><div class="small">Varsayılan olarak kapalı</div></div><span class="pill">Kapalı</span></div></div></aside></div><p class="foot">CloneGRAM, Telegram’ın resmi istemcisi değildir. Bot API sınırlarına ve içerik koruma durumuna uyar.</p>`;if(current==='queue')pageEl.innerHTML=`<div class="hero"><div><span class="eyebrow">YAYIN STÜDYOSU</span><h1>İçerik kuyruğu</h1><p class="desc">Gönderiler burada düzenlenir ve yayından önce kontrol edilir.</p></div><button class="btn" data-action="preview">＋ İçerik ekle</button></div><div class="notice">ⓘ &nbsp;Korumalı içerik veya yeniden yayımlama izni olmayan içerik işlenmez.</div>${rows()}<p class="foot">Örnek öğeler gösteriliyor. Gerçek kuyruk için Telegram API ve sunucu kurulumu gerekir.</p>`;if(current==='connections')pageEl.innerHTML=`<div class="hero"><div><span class="eyebrow">TELEGRAM BAĞLANTILARI</span><h1>Kaynaklar ve hedefler</h1><p class="desc">Botun erişebildiği kaynakları ve yayın yapma yetkisi olan kanalları yönet.</p></div><button class="btn primary" data-action="source">＋ Kaynak ekle</button></div><div class="notice">ⓘ &nbsp;Bot yalnızca üye olduğu kaynakların yeni güncellemelerini alır. Hedef kanalda gönderi yetkisi gerekir.</div><h2>Kaynaklar</h2>${src()}<div class="workflow"><h2>Hedef kanal</h2><div class="source"><div><div class="title">@clonegram_publishing</div><div class="small">Bot yönetici · Gönderi yetkisi var</div></div><span class="ok">Hazır</span></div></div><p class="foot">Token bu önizleme sayfasına girilmemelidir. Gerçek bağlantı için güvenli sunucu ve webhook gerekir.</p>`;if(current==='campaigns')pageEl.innerHTML=`<div class="hero"><div><span class="eyebrow">İZİNLİ ABONELER</span><h1>Kampanyalar</h1><p class="desc">Yalnızca botuna abone olup pazarlama izni veren kişilere ulaş.</p></div><button class="btn primary" data-action="campaign">＋ Kampanya oluştur</button></div><div class="notice">ⓘ &nbsp;İzinsiz soğuk DM yok. Çıkış yapanlar ve botu engelleyenler gönderimden çıkarılmalı.</div><div class="head"><h2>Son kampanyalar</h2><span class="small">Örnek kayıtlar</span></div><div class="list"><div class="listrow header"><span>Kampanya</span><span>Durum</span><span>Kitle</span><span>Tarih</span></div><div class="listrow"><b>Eylül bülteni</b><span class="pill">Tamamlandı</span><span class="small">128 izinli abone</span><span class="small">24 Eyl</span></div><div class="listrow"><b>Yeni koleksiyon duyurusu</b><span class="pill">Taslak</span><span class="small">—</span><span class="small">—</span></div></div><div id="editor"></div><p class="foot">Gönderim sonucu ve bağlantı tıklaması raporlanabilir. Bot API ile görüntülenme/açılma oranı vaat etmeyin.</p>`;if(current==='settings')pageEl.innerHTML=`<div class="hero"><div><span class="eyebrow">ÇALIŞMA ALANI</span><h1>Ayarlar</h1><p class="desc">Yayın davranışını ve güvenlik sınırlarını belirle.</p></div></div><div class="settings"><div><b>Yayından önce onay iste</b><p>Yeni içerik sen onaylayana kadar kuyrukta bekler.</p></div><button class="switch" aria-checked="true" role="switch"><span></span></button></div><div class="settings"><div><b>Yeni içerik bildirimi</b><p>Kaynaklardan içerik geldiğinde uyarı göster.</p></div><button class="switch" aria-checked="false" role="switch"><span></span></button></div><div class="settings"><div><b>Abonelik izinleri</b><p>İzin kaydı, çıkış ve engellenen kullanıcı kontrolü zorunlu.</p></div><span class="pill">Etkin</span></div><p class="foot">Örnek ayarlar tarayıcı önizlemesinde çalışır, sunucuya kaydedilmez.</p>`}
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),3200)}document.addEventListener('click',e=>{const n=e.target.closest('[data-page]');if(n){current=n.dataset.page;render();scrollTo({top:0,behavior:'smooth'});return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='source')toast('Önizleme modu: gerçek Telegram bağlantısı henüz kurulmadı.');if(a==='preview')toast('Bu işlem, güvenli sunucu bağlantısı eklendiğinde etkinleşecek.');if(a==='campaign'){document.querySelector('#editor').innerHTML=`<div class="workflow"><h2>Yeni kampanya taslağı</h2><form id="form"><div class="field"><label for="name">Kampanya adı</label><input id="name" required placeholder="Örn. Ekim duyurusu"></div><div class="field"><label for="audience">İzinli hedef kitle</label><select id="audience"><option>Tüm aktif izinli aboneler</option><option>Etiket: müşteriler</option></select><p class="small">Örnek kitle: 128 aktif abone. Gönderim öncesi sayı yeniden doğrulanır.</p></div><div class="field"><label for="message">Mesaj</label><textarea id="message" placeholder="Mesajını yaz…"></textarea></div><button class="btn primary">Taslağı kaydet</button></form></div>`;document.querySelector('#form').addEventListener('submit',ev=>{ev.preventDefault();toast('Önizleme modu: taslak bu ekranda kaldı, API bağlı değil.');});document.querySelector('#editor').scrollIntoView({behavior:'smooth'});}if(e.target.closest('.switch')){const s=e.target.closest('.switch');s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');toast('Örnek ayar önizlemede değiştirildi.');}});render();
</script></body></html>
