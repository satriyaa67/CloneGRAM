name = "clonegram"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# The dashboard in ../site is served by this same Worker (same origin, no CORS needed).
# Files that exist are served directly; everything else (/api/*, /telegram/webhook, /health) runs the Worker.
[assets]
directory = "../site"

[vars]
# Optional extra browser origin allowed to call the admin API (leave empty for same-origin only).
ALLOWED_ORIGIN = ""

[[d1_databases]]
binding = "DB"
database_name = "clonegram"
# The deploy workflow finds or creates the database and fills this in at deploy time.
# For manual deploys: npx wrangler@4 d1 create clonegram  (then paste the id here)
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Secrets (never commit values). The deploy workflow sets all three:
#   TELEGRAM_BOT_TOKEN, ADMIN_API_TOKEN (from GitHub secrets), TELEGRAM_WEBHOOK_SECRET (generated per deploy)
