# CloneGRAM: one-click deploy to Cloudflare (Worker + D1 + panel, free tier).
# Permission check completed; implementation follows in the next commit.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "site/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN ADMIN_API_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          if [ "${#ADMIN_API_TOKEN}" -lt 24 ]; then
            echo "::error::ADMIN_API_TOKEN must be at least 24 characters."
            exit 1
          fi

      - name: Test
        run: node --test

      - name: Find or create the D1 database
        run: |
          find_id() {
            $WRANGLER d1 list --json | node -e '
              let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => {
                const start = s.indexOf("[");
                const list = start >= 0 ? JSON.parse(s.slice(start)) : [];
                const db = list.find((d) => d.name === "clonegram");
                process.stdout.write(db ? db.uuid : "");
              });'
          }
          DB_ID="$(find_id)"
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database clonegram"
            $WRANGLER d1 create clonegram
            DB_ID="$(find_id)"
          fi
          if [ -z "$DB_ID" ]; then echo "::error::Could not find or create the D1 database."; exit 1; fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "D1 database: $DB_ID"

      - name: Apply database migrations
        run: $WRANGLER d1 migrations apply clonegram --remote

      - name: Deploy Worker and panel
        run: |
          $WRANGLER deploy 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\\.workers\\.dev' deploy.log | head -n 1)"
          if [ -z "$URL" ]; then
            echo "::error::No workers.dev URL in the deploy output. Open Workers & Pages once in the Cloudflare dashboard so a workers.dev subdomain is assigned, then re-run."
            exit 1
          fi
          echo "APP_URL=$URL" >> "$GITHUB_ENV"

      - name: Set Worker secrets
        run: |
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"
          umask 077
          SECRETS_FILE="$(mktemp)"
          node -e 'process.stdout.write(JSON.stringify({
            TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
            ADMIN_API_TOKEN: process.env.ADMIN_API_TOKEN,
            TELEGRAM_WEBHOOK_SECRET: process.argv[1],
          }))' "$WEBHOOK_SECRET" > "$SECRETS_FILE"
          $WRANGLER secret bulk "$SECRETS_FILE"
          rm -f "$SECRETS_FILE"

      - name: Point the Telegram webhook at this deploy
        run: |
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sS -o webhook.json -w '%{http_code}' -X POST "$APP_URL/api/telegram/webhook" \
              -H "authorization: Bearer $ADMIN_API_TOKEN" \
              -H 'content-type: application/json' \
              --data "{\"url\":\"$APP_URL/telegram/webhook\"}" || true)"
            if [ "$code" = "200" ]; then echo "Webhook set."; exit 0; fi
            echo "Attempt $attempt: HTTP $code $(cat webhook.json 2>/dev/null)"
            sleep 10
          done
          echo "::error::Could not set the Telegram webhook. Check TELEGRAM_BOT_TOKEN."
          exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "## CloneGRAM is live"
            echo ""
            echo "Panel: $APP_URL"
            echo ""
            echo "Sign in with your ADMIN_API_TOKEN. Then add the bot as an admin to your source and destination channels."
          } >> "$GITHUB_STEP_SUMMARY"
